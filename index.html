<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARS MUSIC CULT</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d;
      color: #00ff66;
      font-family: monospace;
      text-align: center;
      padding: 20px 10px;
      margin: 0;
    }
    .container {
      border: 1px solid #333;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      background-color: #121212;
    }
    h1 {
      color: #ffffff;
      font-size: 1.5em;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }
    h2 {
      color: #888888;
      font-size: 0.85em;
      font-weight: normal;
      margin-top: 0;
    }
    .sub {
      color: #00ccff;
      margin: 15px 0;
      font-size: 0.8em;
      line-height: 1.4;
    }
    hr {
      border: 0;
      border-top: 1px dashed #333;
      margin: 15px 0;
    }
    .desc {
      color: #00ff66;
      font-size: 0.85em;
      line-height: 1.4;
    }
    .card {
      border: 1px solid #00ff66;
      padding: 15px;
      margin-top: 20px;
      background: #08140c;
      text-align: center;
    }
    .card h3 {
      color: #00ff66;
      margin: 0 0 5px 0;
      font-size: 1.1em;
    }
    .card p {
      color: #888888;
      font-size: 0.75em;
      margin: 0 0 15px 0;
    }
    iframe {
      width: 100%;
      height: 120px;
      border: none;
    }
    .links {
      margin-top: 25px;
    }
    .btn {
      display: inline-block;
      color: #00ccff;
      border: 1px solid #00ccff;
      padding: 10px 18px;
      text-decoration: none;
      font-size: 0.8em;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ARS MUSIC CULT</h1>
    <h2>Búnker de Producción & Underground Hub</h2>

    <hr>

    <div class="sub">
      Productor & DJ: Roland Ars | Rolly Deep | Rolly Roland | Psionick
    </div>

    <hr>

    <p class="desc">
      Conectando frecuencias oscuras y transmisiones modulares directamente desde el laboratorio.
    </p>

    <div class="card">
      <h3>ARTEM SUBCULTURA RADIO</h3>
      <p>• TRANSMISIÓN EN LÍNEA •</p>
      <iframe src="https://zeno.fm/player/artemsc33/"></iframe>
    </div>

    <div class="links">
      <a href="https://facebook.com/ArtemSC33/" target="_blank" rel="noopener noreferrer" class="btn">
        Facebook: Artem Sub Cultura
      </a>
    </div>
  </div>

</body>
</html>
